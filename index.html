<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.github.com https://gist.githubusercontent.com; img-src 'self' data: https:; base-uri 'self'; form-action 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="我的网络收藏夹 - 精心整理的优质网站资源，支持搜索和云端同步">
    <meta property="og:title" content="我的收藏夹 · Favorites">
    <meta property="og:description" content="精心整理的优质网站资源，支持搜索和云端同步">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://listmyfavorites.github.io/">
    <meta name="twitter:card" content="summary">
    <title>我的收藏夹 · Favorites</title>
    <link rel="preload" href="style.css" as="style">
    <link rel="preload" href="script.js" as="script">
    <link rel="icon" href="public/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .theme-toggle--lang {
            right: 72px;
            font-size: 12px;
            font-weight: 700;
            font-family: var(--font-body);
            color: var(--text-secondary);
        }
    </style>
    <!-- 引入 Fuse.js 用于模糊搜索 -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
</head>
<body>
    <div id="offlineBanner" class="offline-banner" style="display:none;">
        ⚠️ 当前处于离线状态，显示的是缓存数据
    </div>
    <div class="bg-decoration" aria-hidden="true">
        <div class="bg-blob bg-blob-1"></div>
        <div class="bg-blob bg-blob-2"></div>
        <div class="bg-blob bg-blob-3"></div>
        <div class="bg-grid"></div>
    </div>
    <div class="container">
        <header>
            <div class="header-decoration"></div>
            <h1>我的网络收藏夹</h1>
            <button id="themeToggle" class="theme-toggle" aria-label="切换深色模式" title="切换深色模式">
                <span class="theme-toggle__icon">🌙</span>
            </button>
            <button id="langToggle" class="theme-toggle theme-toggle--lang" aria-label="Switch language" title="Switch language">
                <span class="lang-toggle__text">EN</span>
            </button>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索网站名称或网址..." aria-label="搜索收藏夹">
                <div class="search-options">
                    <label class="checkbox-label" title="勾选后：输入字符必须按顺序存在（如 'gh' 匹配 'GitHub'）&#10;不勾选：允许拼写错误（如 'gogle' 匹配 'Google'）">
                        <input type="checkbox" id="exactMatch" checked> <span id="exactMatchLabel">精确搜索 (顺序匹配)</span>
                    </label>
                </div>
            </div>
            <div class="action-group">
                <button id="addBtn" class="add-btn" aria-label="添加新收藏">＋ 添加</button>
                <button id="exportBtn" class="add-btn add-btn--secondary" aria-label="导出收藏">导出</button>
                <label for="importInput" class="add-btn add-btn--secondary" aria-label="导入收藏">
                    <span id="importBtnLabel">导入</span>
                    <input type="file" id="importInput" accept=".json" style="display:none">
                </label>
            </div>
        </header>
        
        <main>
            <div id="liveRegion" aria-live="polite" class="sr-only"></div>
            <div id="favoritesList" class="favorites-grid">
                <!-- 收藏项将通过 JavaScript 动态插入这里 -->
            </div>
            <div id="noResults" class="no-results" style="display: none;">
                没有找到匹配的网站
            </div>
        </main>

        <!-- 添加/配置模态框 -->
        <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-content">
                <span class="close-btn" aria-label="关闭">&times;</span>
                <h2 id="modalTitle">添加新收藏</h2>
                
                <!-- Token 设置区域 -->
                <div id="tokenSection" style="display:none;">
                    <p class="tip" id="tokenLabel">首次使用需要配置 GitHub Token (需开启 Gist 权限)</p>
                    <input type="password" id="tokenInput" placeholder="粘贴 GitHub Personal Access Token" aria-labelledby="tokenLabel">
                    <button id="saveTokenBtn" class="primary-btn" aria-label="保存 Token">保存配置</button>
                    <p class="small-tip"><a href="https://github.com/settings/tokens" target="_blank">去 GitHub 申请 Token &rarr;</a></p>
                </div>

                <!-- 添加表单区域 -->
                <form id="addForm" style="display:none;">
                    <div class="form-group">
                <label for="siteName">名称</label>
                        <input type="text" id="siteName" placeholder="例如: GitHub" required>
                    </div>
                    <div class="form-group">
                <label for="siteUrl">网址</label>
                        <input type="url" id="siteUrl" placeholder="https://..." required>
                    </div>
                    <div class="form-group">
                <label for="siteDesc">描述 (可选)</label>
                        <input type="text" id="siteDesc" placeholder="简短的描述...">
                    </div>
                    <div class="form-group">
                <label for="siteTags">标签 (可选，逗号分隔)</label>
                        <input type="text" id="siteTags" placeholder="例如: 工具, 设计, 学习">
                    </div>
                    <button type="submit" class="primary-btn" id="submitBtn">保存到 Gist</button>
                    <div class="form-footer">
                        <span id="statusMsg"></span>
                        <button type="button" id="clearTokenBtn" class="text-btn" aria-label="重置 Token">重置 Token</button>
                    </div>
                </form>
            </div>
        </div>

        <footer>
            <p>&copy; 2025 My Favorites</p>
        </footer>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
